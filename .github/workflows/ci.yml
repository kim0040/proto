# 코드가 올라올 때마다 세 운영체제에서 테스트를 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      # 테스트는 headless 모드로 돌도록 build.gradle에 이미 설정되어 있다 (화면 없는 ubuntu에서도 된다)
      - name: 테스트
        run: ./gradlew test --no-daemon
        shell: bash
