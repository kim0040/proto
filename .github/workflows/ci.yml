# 코드가 올라올 때마다 세 운영체제에서 테스트를 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # v6부터는 캐시 기능이 별도 상용 라이선스(Gradle 이용 약관)라서, MIT 라이선스인 v5를 쓴다
      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v5

      # 테스트는 headless 모드로 돌도록 build.gradle에 이미 설정되어 있다 (화면 없는 ubuntu에서도 된다)
      - name: 테스트
        run: ./gradlew test --no-daemon
        shell: bash

  install-scripts:
    name: 설치 스크립트 문법 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ubuntu 러너에는 shellcheck와 PowerShell(pwsh)이 깔려 있다
      - name: Mac 설치 스크립트 (shellcheck)
        run: shellcheck scripts/install-mac.sh

      - name: Windows 설치 스크립트 (PowerShell 문법)
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install-windows.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }
          Write-Host '문법 오류 없음'
