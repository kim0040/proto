# v1.0.0 같은 태그를 올리면 Windows·macOS 앱을 만들어 GitHub Release에 붙인다.
# 손으로 실행(workflow_dispatch)하면 연습 실행: 앱만 만들어 Actions 결과(Artifacts)로 올리고 Release는 만들지 않는다.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 확인 (태그·테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 태그(v1.0.0)와 build.gradle의 version('1.0.0')이 같아야 한다. 다르면 여기서 멈춘다
      - name: 태그와 버전 맞는지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          GRADLE_VERSION=$(sed -n "s/^version = '\(.*\)'.*/\1/p" build.gradle | head -n 1)
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::build.gradle에서 version 줄을 찾지 못했어요."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$GRADLE_VERSION" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 build.gradle의 version(v$GRADLE_VERSION)이 달라요. build.gradle의 version을 고치고 커밋한 뒤, 태그를 지우고 다시 만들어 주세요."
            exit 1
          fi
          echo "태그 $GITHUB_REF_NAME 와 버전 $GRADLE_VERSION 이 맞아요."

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # v6부터는 캐시 기능이 별도 상용 라이선스(Gradle 이용 약관)라서, MIT 라이선스인 v5를 쓴다
      - uses: gradle/actions/setup-gradle@v5

      - name: 테스트
        run: ./gradlew test --no-daemon

  build:
    name: 앱 만들기 (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # macos-latest는 Apple Silicon(arm64)이다 → macOS 앱도 arm64 전용이 된다
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # v6부터는 캐시 기능이 별도 상용 라이선스(Gradle 이용 약관)라서, MIT 라이선스인 v5를 쓴다
      - uses: gradle/actions/setup-gradle@v5

      # Windows 설치 파일(msi)에는 WiX 3가 필요하다. 러너에 깔려 있으면 길만 잡아 주고, 없으면 설치한다
      - name: WiX 준비 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          shopt -s nullglob
          CANDIDATES=("/c/Program Files (x86)"/WiX*Toolset*v3*)
          if [ ${#CANDIDATES[@]} -eq 0 ]; then
            choco install wixtoolset --no-progress -y
            CANDIDATES=("/c/Program Files (x86)"/WiX*Toolset*v3*)
          fi
          WIX_DIR="${CANDIDATES[0]}"
          echo "$WIX_DIR/bin" >> "$GITHUB_PATH"

      # macOS 앱 이미지는 build.gradle의 macAdhocSign 작업이 임시(ad-hoc) 서명을 한다 (Apple 인증서는 없다)
      - name: 앱 이미지·zip·설치 파일 만들기
        run: ./gradlew jpackageImage packageZip jpackageInstaller --no-daemon
        shell: bash

      - name: 서명 확인 (macOS)
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict -v build/jpackage/image/ScheduleApp.app

      - name: 결과 파일 목록
        shell: bash
        run: ls -l build/dist

      - uses: actions/upload-artifact@v7
        with:
          name: ScheduleApp-${{ runner.os }}
          path: build/dist/*
          if-no-files-found: error

  release:
    name: GitHub Release 만들기
    needs: build
    # 태그를 올렸을 때만. 손으로 실행한 연습 실행은 여기서 끝난다
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ScheduleApp-*
          merge-multiple: true

      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${TAG#v}"
          NOTES="docs/릴리즈-노트/${VERSION}.md"
          # 파일 이름에서 버전을 뺀다 (ScheduleApp-1.1.0-macos-arm64.dmg → ScheduleApp-macos-arm64.dmg).
          # 그래야 releases/latest/download/<이름> 주소가 늘 최신 버전을 가리켜서, 설치 안내의 바로 받기 링크와 설치 스크립트가 버전마다 바뀌지 않는다
          for f in dist/*; do
            mv "$f" "dist/$(basename "$f" | sed "s/-${VERSION}-/-/")"
          done
          find dist -type f -print
          ARGS=(--generate-notes --title "일정 관리 ${TAG}")
          if [ -f "$NOTES" ]; then
            ARGS+=(--notes-file "$NOTES")
          fi
          gh release create "$TAG" "${ARGS[@]}" dist/*

  install-check:
    name: 설치 스크립트로 설치해 보기 (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # 이번 태그로 만든 파일을 받아 실제 사용자와 같은 스크립트로 설치한다 (앱은 열지 않는다).
      # latest 주소 대신 태그 주소를 써서, 다른 릴리즈가 아니라 방금 만든 파일을 확인한다
      - name: Mac 설치 스크립트
        if: runner.os == 'macOS'
        env:
          INSTALL_DIR: ${{ runner.temp }}/apps
          NO_OPEN: '1'
          ZIP_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ScheduleApp-macos-arm64.zip
        run: |
          mkdir -p "$INSTALL_DIR"
          bash scripts/install-mac.sh < /dev/null
          # 두 번째 실행은 업데이트(예전 앱과 바꿔치기) 경로를 확인한다
          bash scripts/install-mac.sh < /dev/null
          codesign --verify --deep --strict "$INSTALL_DIR/ScheduleApp.app"

      # 사용자는 irm ... | iex 로 실행하므로, 파일 내용을 문자열로 읽어 iex에 넘기는 방식 그대로 확인한다
      - name: Windows 설치·지우기 스크립트
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SCHEDULEAPP_INSTALL_DIR: ${{ runner.temp }}\apps\ScheduleApp
          SCHEDULEAPP_NO_OPEN: '1'
          SCHEDULEAPP_ZIP_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ScheduleApp-windows-x64.zip
        run: |
          Get-Content -Raw -Encoding UTF8 scripts/install-windows.ps1 | Invoke-Expression
          # 두 번째 실행은 업데이트(예전 앱과 바꿔치기) 경로를 확인한다
          Get-Content -Raw -Encoding UTF8 scripts/install-windows.ps1 | Invoke-Expression
          if (-not (Test-Path "$env:SCHEDULEAPP_INSTALL_DIR\ScheduleApp.exe")) { throw '설치된 exe가 없어요' }
          $env:SCHEDULEAPP_UNINSTALL = '1'
          Get-Content -Raw -Encoding UTF8 scripts/install-windows.ps1 | Invoke-Expression
          if (Test-Path $env:SCHEDULEAPP_INSTALL_DIR) { throw '지우기가 되지 않았어요' }
