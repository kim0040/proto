# 설치 스크립트(scripts/)를 고치면, 지금 나와 있는 최신 릴리즈로 실제 Windows·Mac에 설치·업데이트·지우기를 해 본다.
# (사용자는 main의 스크립트를 바로 받아 쓰므로, 릴리즈를 새로 내지 않고 스크립트만 고쳐도 여기서 확인된다)
name: Install scripts

on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/install-scripts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 설치·업데이트·지우기
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 사용자는 irm ... | iex 로 실행하므로, 파일 내용을 문자열로 읽어 iex에 넘기는 방식 그대로 확인한다.
      # Windows PowerShell 5.1은 이 단계의 스크립트를 ANSI로 읽어 한글이 깨지므로, 아래 run에는 한글을 쓰지 않는다
      # (바로 가기 이름은 환경 변수로 넘긴다. 환경 변수는 유니코드로 전달된다)
      - name: 설치, 업데이트, 지우기
        shell: powershell
        env:
          SCHEDULEAPP_INSTALL_DIR: ${{ runner.temp }}\apps\ScheduleApp
          SCHEDULEAPP_NO_OPEN: '1'
          SHORTCUT_NAME: 일정 관리
        run: |
          Get-Content -Raw -Encoding UTF8 scripts/install-windows.ps1 | Invoke-Expression
          Get-Content -Raw -Encoding UTF8 scripts/install-windows.ps1 | Invoke-Expression
          if (-not (Test-Path "$env:SCHEDULEAPP_INSTALL_DIR\ScheduleApp.exe")) { throw 'installed exe is missing' }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) "$env:SHORTCUT_NAME.lnk"
          if (-not (Test-Path -LiteralPath $link)) { throw "Start menu shortcut is missing: $link" }
          $env:SCHEDULEAPP_UNINSTALL = '1'
          Get-Content -Raw -Encoding UTF8 scripts/install-windows.ps1 | Invoke-Expression
          if (Test-Path $env:SCHEDULEAPP_INSTALL_DIR) { throw 'uninstall left the app folder' }
          if (Test-Path -LiteralPath $link) { throw 'uninstall left the shortcut' }

  mac:
    name: Mac 설치·업데이트
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 설치, 업데이트
        env:
          INSTALL_DIR: ${{ runner.temp }}/apps
          NO_OPEN: '1'
        run: |
          mkdir -p "$INSTALL_DIR"
          bash scripts/install-mac.sh < /dev/null
          bash scripts/install-mac.sh < /dev/null
          codesign --verify --deep --strict "$INSTALL_DIR/ScheduleApp.app"
          # 업데이트 뒤 임시 폴더(.ScheduleApp.app.new/.old)가 남지 않았는지
          for f in "$INSTALL_DIR"/.[!.]* "$INSTALL_DIR"/*; do
            [ -e "$f" ] && [ "$(basename "$f")" != ScheduleApp.app ] && { echo "left over: $f"; exit 1; }
          done
          true
