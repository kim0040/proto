# [경계 boundary] 밝은 테마 색상 토큰 (노션 캘린더처럼 차분한 중립색 + 1px 헤어라인, 본문 글자 ≥ 4.5:1)
# 강조색(@accentColor, @accentSoft, @onAccent)은 설정에서 고른 값으로 ThemeManager가 덮어쓴다. 여기 값은 기본(파랑)이다.

@background = #FFFFFF
@foreground = #2A2926
@accentColor = #1A71C8
@accentSoft = #E4EEF8
@onAccent = #FFFFFF

# --- 의미 토큰 (코드는 UIManager "proto.*" 키로만 색을 읽는다) ---
proto.bg = #FFFFFF
proto.sidebar = #F7F7F5
proto.surface = #FFFFFF
proto.subtle = #F7F7F5
proto.hover = #EFEFED
proto.thumb = #FFFFFF
proto.track = #EFEFED
proto.border = #E9E9E7
proto.borderStrong = #D9D9D6
proto.text = #2A2926
proto.muted = #71706B
proto.faint = #918F8B
proto.accent = @accentColor
proto.accentSoft = @accentSoft
proto.onAccent = @onAccent
proto.danger = #C4281C
proto.dangerSoft = #FDECEC
proto.success = #19794A
proto.warning = #9A5B00
proto.scrim = #2A292659

# --- 상태: 예정 / 진행 중 / 지연 / 완료 (글자색 + 옅은 배경) ---
proto.state.scheduled.fg = #5E5D59
proto.state.scheduled.bg = #F1F1EF
proto.state.progress.fg = #1A5FA8
proto.state.progress.bg = #E7F1FB
proto.state.delayed.fg = #B3261E
proto.state.delayed.bg = #FCE8E6
proto.state.done.fg = #176B3F
proto.state.done.bg = #E3F3EA

# --- 카테고리 색 (고정 팔레트 12색). 점·연한 바탕(16%)·진한 바탕 어느 쪽으로 써도 읽히도록 밝기를 맞췄다.
# 흰 글자를 쓰는 색은 흰색과 대비 ≥ 4.5:1, 검정 계열 글자를 쓰는 색(주황·하늘·노랑)은 ≥ 4.5:1, 점은 흰 배경과 ≥ 3:1 ---
proto.cat.blue = #1B76D0
proto.cat.orange = #D9730D
proto.cat.teal = #0F7B6C
proto.cat.rose = #C04988
proto.cat.green = #438160
proto.cat.purple = #8E63AF
proto.cat.sky = #2E9BC7
proto.cat.brown = #9C6952
proto.cat.red = #D1423C
proto.cat.yellow = #C0892C
proto.cat.indigo = #5B5BD6
proto.cat.gray = #767572

# --- FlatLaf 컴포넌트 색 ---
Panel.background = @background
Component.borderColor = #DEDEDB
Component.disabledBorderColor = #E9E9E7
Component.focusColor = @accentColor
Component.focusedBorderColor = @accentColor
Button.background = #FFFFFF
Button.foreground = #2A2926
Button.borderColor = #DEDEDB
Button.hoverBackground = #F7F7F5
Button.pressedBackground = #EFEFED
Button.default.background = @accentColor
Button.default.foreground = @onAccent
Button.default.hoverBackground = darken(@accentColor, 6%)
Button.default.pressedBackground = darken(@accentColor, 12%)
Button.default.borderColor = @accentColor
Button.default.focusColor = @accentColor
TextField.background = #FFFFFF
TextArea.background = #FFFFFF
ComboBox.background = #FFFFFF
ComboBox.buttonBackground = #FFFFFF
ComboBox.buttonArrowColor = #71706B
ComboBox.popupBackground = #FFFFFF
List.background = #FFFFFF
List.selectionBackground = @accentSoft
List.selectionForeground = #2A2926
List.selectionInactiveBackground = @accentSoft
List.selectionInactiveForeground = #2A2926
PopupMenu.background = #FFFFFF
PopupMenu.borderColor = #E4E4E1
MenuItem.selectionBackground = #F1F1EF
MenuItem.selectionForeground = #2A2926
MenuItem.background = #FFFFFF
ToolTip.background = #2A2926
ToolTip.foreground = #FFFFFF
ScrollBar.thumb = #D3D3CF
ScrollBar.hoverThumbColor = #B9B9B5
ScrollBar.pressedThumbColor = #A3A39F
ScrollBar.track = #00000000
Separator.foreground = #E9E9E7
TitlePane.background = #F7F7F5
TitlePane.inactiveBackground = #F7F7F5
TitlePane.foreground = #2A2926
Label.disabledForeground = #918F8B
