# [경계 boundary] 밝은 테마 색상 토큰 (명도 대비: 본문 글자 ≥ 4.5:1)

@background = #FFFFFF
@foreground = #1B1F26
@accentColor = #2F6BDB

# --- 의미 토큰 (코드는 UIManager "proto.*" 키로만 색을 읽는다) ---
proto.bg = #FFFFFF
proto.sidebar = #F5F6F8
proto.surface = #FFFFFF
proto.subtle = #F3F4F7
proto.hover = #EDEFF3
proto.thumb = #FFFFFF
proto.track = #ECEEF2
proto.border = #E4E7EC
proto.borderStrong = #CDD2DB
proto.text = #1B1F26
proto.muted = #5A6472
proto.faint = #8A93A0
proto.accent = #2F6BDB
proto.accentSoft = #E6EEFD
proto.onAccent = #FFFFFF
proto.danger = #C4281C
proto.dangerSoft = #FDECEA
proto.success = #19794A
proto.warning = #9A5B00
proto.scrim = #1B1F2659

# --- 상태: 예정 / 진행 중 / 지연 / 완료 (글자색 + 옅은 배경) ---
proto.state.scheduled.fg = #4A5565
proto.state.scheduled.bg = #EEF0F4
proto.state.progress.fg = #1F4FB4
proto.state.progress.bg = #E2ECFE
proto.state.delayed.fg = #B3261E
proto.state.delayed.bg = #FCE8E6
proto.state.done.fg = #176B3F
proto.state.done.bg = #DFF3E7

# --- 카테고리 색 (고정 팔레트 8색, 점과 막대 데이터에만 사용) ---
proto.cat.0 = #3F7AE0
proto.cat.1 = #D9822B
proto.cat.2 = #1D9A8A
proto.cat.3 = #D2557A
proto.cat.4 = #5A9F4B
proto.cat.5 = #8B6CD9
proto.cat.6 = #2A9BC4
proto.cat.7 = #A9714B

# --- FlatLaf 컴포넌트 색 ---
Panel.background = @background
Component.borderColor = #D5D9E1
Component.disabledBorderColor = #E4E7EC
Component.focusColor = #2F6BDB
Component.focusedBorderColor = #2F6BDB
Button.background = #FFFFFF
Button.foreground = #1B1F26
Button.borderColor = #D5D9E1
Button.hoverBackground = #F3F4F7
Button.pressedBackground = #E9ECF1
Button.default.background = #2F6BDB
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = #2A60C6
Button.default.pressedBackground = #2455B2
Button.default.borderColor = #2F6BDB
Button.default.focusColor = #2F6BDB
TextField.background = #FFFFFF
TextArea.background = #FFFFFF
ComboBox.background = #FFFFFF
ComboBox.buttonBackground = #FFFFFF
ComboBox.buttonArrowColor = #5A6472
ComboBox.popupBackground = #FFFFFF
List.background = #FFFFFF
List.selectionBackground = #E6EEFD
List.selectionForeground = #1B1F26
List.selectionInactiveBackground = #E6EEFD
List.selectionInactiveForeground = #1B1F26
PopupMenu.background = #FFFFFF
PopupMenu.borderColor = #E4E7EC
MenuItem.selectionBackground = #F0F2F6
MenuItem.selectionForeground = #1B1F26
MenuItem.background = #FFFFFF
ToolTip.background = #1B1F26
ToolTip.foreground = #FFFFFF
ScrollBar.thumb = #C9CED8
ScrollBar.hoverThumbColor = #AEB5C2
ScrollBar.pressedThumbColor = #98A1B0
ScrollBar.track = #00000000
Separator.foreground = #E4E7EC
TitlePane.background = #F5F6F8
TitlePane.inactiveBackground = #F5F6F8
TitlePane.foreground = #1B1F26
TextComponent.arc = 10
Label.disabledForeground = #8A93A0
