# [경계 boundary] 어두운 테마 색상 토큰 (노션 캘린더의 #191919 바탕, 1px 헤어라인, 본문 글자 ≥ 4.5:1)
# 강조색(@accentColor, @accentSoft, @onAccent)은 설정에서 고른 값으로 ThemeManager가 덮어쓴다. 여기 값은 기본(파랑)이다.

@background = #191919
@foreground = #E6E6E4
@accentColor = #4094E6
@accentSoft = #223446
@onAccent = #141414

proto.bg = #191919
proto.sidebar = #202020
proto.surface = #252525
proto.subtle = #202020
proto.hover = #2C2C2C
proto.thumb = #3A3A3A
proto.track = #2A2A2A
proto.border = #2F2F2F
proto.borderStrong = #404040
proto.text = #E6E6E4
proto.muted = #9A9A96
proto.faint = #73736F
proto.accent = @accentColor
proto.accentSoft = @accentSoft
proto.onAccent = @onAccent
proto.danger = #FF8A7F
proto.dangerSoft = #3B2422
proto.success = #66CF92
proto.warning = #E8B565
proto.scrim = #00000099

proto.state.scheduled.fg = #A8A8A4
proto.state.scheduled.bg = #2C2C2C
proto.state.progress.fg = #7DB4F0
proto.state.progress.bg = #1F3347
proto.state.delayed.fg = #FF9C92
proto.state.delayed.bg = #42262A
proto.state.done.fg = #7DD8A2
proto.state.done.bg = #1F3A2C

# 어두운 테마의 카테고리 색: 모두 어두운 글자를 얹는 밝기(검정 계열 글자와 ≥ 4.5:1)이고, 어두운 바탕과도 점으로 ≥ 3:1
proto.cat.blue = #4F8FE6
proto.cat.orange = #D98A4E
proto.cat.teal = #3EA796
proto.cat.rose = #D3609B
proto.cat.green = #529E72
proto.cat.purple = #A372D6
proto.cat.sky = #4DA8D4
proto.cat.brown = #BA856F
proto.cat.red = #E15D5B
proto.cat.yellow = #CA9849
proto.cat.indigo = #8080EE
proto.cat.gray = #9B9B9B

Panel.background = @background
Component.borderColor = #404040
Component.disabledBorderColor = #2F2F2F
Component.focusColor = @accentColor
Component.focusedBorderColor = @accentColor
Button.background = #252525
Button.foreground = #E6E6E4
Button.borderColor = #404040
Button.hoverBackground = #2C2C2C
Button.pressedBackground = #343434
Button.default.background = @accentColor
Button.default.foreground = @onAccent
Button.default.hoverBackground = lighten(@accentColor, 6%)
Button.default.pressedBackground = darken(@accentColor, 6%)
Button.default.borderColor = @accentColor
Button.default.focusColor = @accentColor
TextField.background = #202020
TextArea.background = #202020
ComboBox.background = #202020
ComboBox.buttonBackground = #202020
ComboBox.buttonArrowColor = #9A9A96
ComboBox.popupBackground = #252525
List.background = #252525
List.selectionBackground = @accentSoft
List.selectionForeground = #E6E6E4
List.selectionInactiveBackground = @accentSoft
List.selectionInactiveForeground = #E6E6E4
PopupMenu.background = #252525
PopupMenu.borderColor = #303030
MenuItem.selectionBackground = #2F2F2F
MenuItem.selectionForeground = #E6E6E4
MenuItem.background = #252525
ToolTip.background = #E6E6E4
ToolTip.foreground = #191919
ScrollBar.thumb = #3F3F3F
ScrollBar.hoverThumbColor = #565656
ScrollBar.pressedThumbColor = #6A6A6A
ScrollBar.track = #00000000
Separator.foreground = #2F2F2F
TitlePane.background = #202020
TitlePane.inactiveBackground = #202020
TitlePane.foreground = #E6E6E4
Label.disabledForeground = #73736F
