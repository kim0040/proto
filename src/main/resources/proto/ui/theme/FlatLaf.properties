# [경계 boundary] 공통 FlatLaf 조정값: 둥근 모서리, 간격, 스크롤바 (색은 FlatLightLaf/FlatDarkLaf.properties)

# --- 모서리 / 포커스 ---
Component.arc = 10
Button.arc = 10
TextComponent.arc = 10
CheckBox.arc = 4
ProgressBar.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.borderWidth = 1
Button.borderWidth = 1
Component.arrowType = chevron
ComboBox.padding = 3,8,3,6
TextField.margin = 3,8,3,8
TextArea.margin = 6,8,6,8
Button.margin = 4,14,4,14
Button.minimumWidth = 0

# --- 스크롤바: 얇고 둥근 막대, 트랙 없음 ---
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.trackArc = 999
ScrollBar.trackInsets = 2,2,2,2
ScrollBar.showButtons = false
ScrollBar.hoverThumbWithTrack = false
ScrollPane.smoothScrolling = true
ScrollPane.borderWidth = 0

# --- 팝업 메뉴 / 툴팁 ---
PopupMenu.borderCornerRadius = 10
PopupMenu.borderInsets = 6,6,6,6
MenuItem.selectionArc = 8
MenuItem.selectionInsets = 0,0,0,0
MenuItem.margin = 5,10,5,10
PopupMenu.dropShadowPainted = true
ToolTip.borderCornerRadius = 8

# --- 구분선 ---
Separator.height = 1

# --- 제목 표시줄(Windows 장식) ---
TitlePane.unifiedBackground = true
TitlePane.showIcon = false
TitlePane.centerTitle = false
