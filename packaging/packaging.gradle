// 네이티브 앱 묶음 작업 (build.gradle에서 불러 쓴다)
//   jpackageImage     앱 이미지: macOS는 ScheduleApp.app, Windows는 ScheduleApp 폴더 (자바 런타임 포함)
//   packageZip        앱 이미지를 zip으로 묶음 (설치 없이 풀어서 실행)
//   jpackageInstaller macOS는 dmg, Windows는 msi (WiX 3 필요)
// 결과 파일 이름: build/dist/ScheduleApp-<버전>-<os>-<arch>.<확장자>

def appName = 'ScheduleApp'
def vendorName = 'proto'
def macIdentifier = 'kr.ac.proto.scheduleapp'
def macDisplayName = '일정 관리'
// 윈도우 MSI 업그레이드 식별자: 바꾸면 이전 버전 위에 덮어 설치되지 않고 따로 설치된다. 절대 바꾸지 말 것
def winUpgradeUuid = '5b8f2c1e-3a47-4d09-9c6e-7e1d2a4b8f10'

def appVersion = project.version.toString()
def osName = System.getProperty('os.name').toLowerCase()
def isMac = osName.contains('mac')
def isWindows = osName.contains('win')
def archName = System.getProperty('os.arch').toLowerCase()
def archLabel = (archName == 'aarch64' || archName == 'arm64') ? 'arm64' : 'x64'
def osLabel = isMac ? 'macos' : (isWindows ? 'windows' : 'linux')

// 묶을 JDK: -PpackagingJdk가 있으면 그것, 없으면 지금 Gradle을 돌리는 JDK
def jdkHome = providers.gradleProperty('packagingJdk').orElse(System.getProperty('java.home'))
def jdkTool = { String tool ->
    def exe = isWindows ? tool + '.exe' : tool
    new File(new File(jdkHome.get(), 'bin'), exe).absolutePath
}

def installLibDir = layout.buildDirectory.dir('install/' + rootProject.name + '/lib')
def imageDir = layout.buildDirectory.dir('jpackage/image')
def installerDir = layout.buildDirectory.dir('jpackage/installer')
def distDir = layout.buildDirectory.dir('dist')
def mainJarName = provider { tasks.named('jar').get().archiveFileName.get() }
def appImagePath = provider { new File(imageDir.get().asFile, isMac ? appName + '.app' : appName) }
def distName = { String ext -> "${appName}-${appVersion}-${osLabel}-${archLabel}.${ext}" }
def appMainClass = application.mainClass
def appJvmArgs = application.applicationDefaultJvmArgs
def iconFile = new File(rootProject.projectDir, isMac ? 'packaging/macos/ScheduleApp.icns' : 'packaging/windows/ScheduleApp.ico')

// jdeps로 앱이 쓰는 모듈을 알아내고, 한글(날짜 이름)·HTTPS·sun.misc 처럼 jdeps가 못 찾는 모듈을 더한다 (이 JDK에 있는 것만)
def runtimeModules = {
    def libDir = installLibDir.get().asFile
    def jars = libDir.listFiles({ f -> f.name.endsWith('.jar') } as FileFilter).collect { it.absolutePath }
    def found = providers.exec {
        commandLine([jdkTool('jdeps'), '--print-module-deps', '--ignore-missing-deps', '--multi-release', '17'] + jars)
    }.standardOutput.asText.get().readLines().findAll { !it.isBlank() }.last().trim().split(',') as List
    def available = providers.exec {
        commandLine(jdkTool('java'), '--list-modules')
    }.standardOutput.asText.get().readLines().collect { it.split('@')[0].trim() } as Set
    def extra = ['jdk.localedata', 'jdk.crypto.ec', 'jdk.unsupported'].findAll { available.contains(it) }
    (found + extra).findAll { !it.isEmpty() }.unique().sort().join(',')
}

tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = "앱 이미지를 만든다 (자바 런타임 포함): build/jpackage/image/${isMac ? appName + '.app' : appName}"
    dependsOn 'installDist'
    inputs.dir(installLibDir)
    outputs.dir(imageDir)
    doFirst {
        imageDir.get().asFile.deleteDir()
        imageDir.get().asFile.mkdirs()
        def args = [jdkTool('jpackage'), '--type', 'app-image', '--dest', imageDir.get().asFile.path,
                    '--input', installLibDir.get().asFile.path, '--main-jar', mainJarName.get(),
                    '--main-class', appMainClass.get(), '--name', appName,
                    '--app-version', appVersion, '--vendor', vendorName,
                    '--description', '일정 관리 데스크톱 앱', '--icon', iconFile.path,
                    '--add-modules', runtimeModules(),
                    '--jlink-options', '--strip-debug --no-header-files --no-man-pages --compress=zip-6']
        appJvmArgs.each { args += ['--java-options', it] }
        if (isMac) {
            args += ['--mac-package-identifier', macIdentifier, '--mac-package-name', macDisplayName]
        }
        commandLine args
    }
}

// macOS: Apple 인증서가 없으므로 임시(ad-hoc) 서명을 한다. Apple Silicon은 서명이 없는 앱을 아예 실행하지 않는다
tasks.register('macAdhocSign', Exec) {
    group = 'distribution'
    description = 'macOS 앱 이미지에 임시(ad-hoc) 서명을 한다'
    dependsOn 'jpackageImage'
    onlyIf { isMac }
    doFirst {
        commandLine 'codesign', '--force', '--deep', '-s', '-', appImagePath.get().path
    }
}

// macOS: ditto는 심볼릭 링크·실행 권한·서명 정보를 그대로 보존한다 (일반 zip 작업은 링크를 풀어 버린다)
tasks.register('zipMacApp', Exec) {
    description = 'macOS 앱 이미지를 ditto로 zip에 담는다'
    dependsOn 'jpackageImage', 'macAdhocSign'
    onlyIf { isMac }
    doFirst {
        def zip = new File(distDir.get().asFile, distName('zip'))
        zip.parentFile.mkdirs()
        zip.delete()
        commandLine 'ditto', '-c', '-k', '--keepParent', appImagePath.get().path, zip.path
    }
}

tasks.register('zipWindowsApp', Zip) {
    description = 'Windows 앱 이미지 폴더를 zip에 담는다'
    dependsOn 'jpackageImage'
    onlyIf { !isMac }
    from(appImagePath) { into appName }
    destinationDirectory = distDir
    archiveFileName = distName('zip')
}

tasks.register('packageZip') {
    group = 'distribution'
    description = "앱 이미지를 build/dist/${appName}-<버전>-<os>-<arch>.zip 으로 묶는다 (설치 없이 풀어서 실행)"
    dependsOn 'zipMacApp', 'zipWindowsApp'
    doLast {
        logger.lifecycle("만든 파일: ${new File(distDir.get().asFile, distName('zip'))}")
    }
}

tasks.register('jpackageInstaller', Exec) {
    group = 'distribution'
    description = "설치 파일을 만든다: macOS dmg, Windows msi(WiX 필요) → build/dist/${appName}-<버전>-<os>-<arch>.<확장자>"
    dependsOn 'jpackageImage', 'macAdhocSign'
    onlyIf { isMac || isWindows }
    doFirst {
        def type = isMac ? 'dmg' : 'msi'
        installerDir.get().asFile.deleteDir()
        installerDir.get().asFile.mkdirs()
        def args = [jdkTool('jpackage'), '--type', type, '--dest', installerDir.get().asFile.path,
                    '--app-image', appImagePath.get().path, '--name', appName,
                    '--app-version', appVersion, '--vendor', vendorName,
                    '--description', '일정 관리 데스크톱 앱', '--icon', iconFile.path]
        if (isMac) {
            args += ['--mac-package-identifier', macIdentifier, '--mac-package-name', macDisplayName]
        } else {
            args += ['--win-dir-chooser', '--win-menu', '--win-shortcut', '--win-per-user-install',
                     '--win-menu-group', appName, '--win-upgrade-uuid', winUpgradeUuid]
        }
        commandLine args
    }
    doLast {
        def ext = isMac ? 'dmg' : 'msi'
        def made = installerDir.get().asFile.listFiles({ f -> f.name.endsWith('.' + ext) } as FileFilter)[0]
        def target = new File(distDir.get().asFile, distName(ext))
        target.parentFile.mkdirs()
        target.delete()
        made.renameTo(target)
        logger.lifecycle("만든 파일: ${target}")
    }
}
