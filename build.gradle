plugins {
    id 'application'
}

group = 'proto'
// 앱 버전의 유일한 출처. 묶음 파일 이름·설치 파일·설정 화면의 버전 표시가 모두 이 값을 따른다 (macOS는 첫 숫자가 1 이상이어야 함)
version = '1.1.2'

repositories {
    mavenCentral()
}

dependencies {
    // 화면(ui 패키지)에서만 쓰는 라이브러리. 기능 코드(entity/logic/control/repository)는 쓰지 않음
    implementation 'com.formdev:flatlaf:3.8'
    implementation 'com.formdev:flatlaf-extras:3.8'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 팀원 PC(JDK 17)에서도 돌도록 Java 17 문법/바이트코드로 컴파일
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

application {
    mainClass = 'proto.app.Main'
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8', '-Dsun.java2d.uiScale.enabled=true', '--enable-native-access=ALL-UNNAMED']
}

// data/ 폴더가 프로젝트 루트에 생기도록 실행 위치 고정
tasks.named('run') {
    workingDir = rootProject.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-Djava.awt.headless=true', '-Dfile.encoding=UTF-8'
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

// 화면 캡처(검증용): 임시 데이터로 여러 창 크기(1440×900 ~ 세로 800×1000)·밝은/어두운 테마의 모든 화면을 2배 크기 PNG로 screenshots/ 에 저장한다 (git 제외 폴더)
tasks.register('screenshots', JavaExec) {
    group = 'verification'
    description = 'UI 화면을 PNG로 저장한다'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'proto.app.dev.ScreenshotMain'
    workingDir = rootProject.projectDir
    args = [layout.projectDirectory.dir('screenshots').asFile.path]
    jvmArgs '-Dfile.encoding=UTF-8', '-Dapple.awt.application.appearance=system', '--enable-native-access=ALL-UNNAMED'
}

// jar 매니페스트에 버전을 넣는다: 설정 화면이 Implementation-Version으로 읽는다 (gradle run·테스트처럼 jar가 아니면 "개발판")
tasks.named('jar') {
    manifest {
        attributes 'Implementation-Title': 'ScheduleApp', 'Implementation-Version': project.version
    }
}

// ───────────── 네이티브 앱 묶음 (jpackage) ─────────────
// 서드파티 플러그인 없이, 빌드를 돌리는 JDK의 jpackage·jlink·jdeps를 그대로 쓴다.
// 다른 JDK로 묶으려면 -PpackagingJdk=<JDK 경로>. 결과물: build/jpackage(중간), build/dist(최종)
apply from: 'packaging/packaging.gradle'
