plugins {
    id 'application'
}

group = 'proto'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    // 화면(ui 패키지)에서만 쓰는 라이브러리. 기능 코드(entity/logic/control/repository)는 쓰지 않음
    implementation 'com.formdev:flatlaf:3.8'
    implementation 'com.formdev:flatlaf-extras:3.8'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 팀원 PC(JDK 17)에서도 돌도록 Java 17 문법/바이트코드로 컴파일
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

application {
    mainClass = 'proto.app.Main'
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8', '-Dsun.java2d.uiScale.enabled=true']
}

// data/ 폴더가 프로젝트 루트에 생기도록 실행 위치 고정
tasks.named('run') {
    workingDir = rootProject.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-Djava.awt.headless=true', '-Dfile.encoding=UTF-8'
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
